<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#140c07">
<title>Zombie Miner</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff4d8;--line:#3a1a08;--gold:#ffd23a;--pill:rgba(46,22,8,.82);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pill:rgba(30,14,5,.88)}}
:root[data-theme="dark"]{--pill:rgba(30,14,5,.88)}
html,body{height:100%;margin:0;overflow:hidden;background:#2a1206;font-family:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.t{text-shadow:0 2px 0 var(--line),0 0 4px var(--line),1px 1px 0 var(--line),-1px 1px 0 var(--line)}
#top{position:fixed;left:0;right:0;top:calc(8px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;padding:0 10px;pointer-events:none}
.pill{display:flex;align-items:center;gap:6px;background:var(--pill);border:2px solid #c98a2a;border-radius:20px;padding:3px 12px 3px 4px;font-size:18px;min-width:78px}
.ic{width:24px;height:24px;border-radius:50%;flex:none;border:2px solid var(--line)}
.ic.c{background:radial-gradient(circle at 35% 30%,#fff2a0,#f5b800 60%,#a87000)}
.ic.g{background:radial-gradient(circle at 35% 30%,#d8f6ff,#2e9bff 60%,#1442b8);border-radius:6px;transform:rotate(45deg) scale(.8)}
#ban{text-align:center;margin-top:2px}
#mine{font-size:24px;background:linear-gradient(#ff9a3a,#d95a12);border:3px solid var(--line);border-radius:12px;padding:2px 18px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
#bar{height:12px;width:120px;margin:5px auto 0;border:2px solid var(--line);border-radius:8px;background:#3a1a08;overflow:hidden;position:relative}
#fill{height:100%;width:0;background:linear-gradient(#9cf05a,#3fae1e);transition:width .3s}
#bt{position:absolute;inset:0;font-size:10px;line-height:9px;text-align:center}
#bot{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(#5a2c10,#2e1507);border-top:4px solid #c98a2a;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:3px solid var(--line);border-radius:14px;padding:5px 4px;font:inherit;color:#fff;background:linear-gradient(#ffb83a,#e8741a);box-shadow:0 4px 0 #5a2506,inset 0 2px 0 rgba(255,255,255,.55);display:flex;align-items:center;gap:6px;text-shadow:0 2px 0 var(--line),0 0 3px var(--line)}
.slot:active:not(.off){transform:translateY(3px);box-shadow:0 1px 0 #5a2506,inset 0 2px 0 rgba(255,255,255,.55)}
.slot.off{background:linear-gradient(#9a8a78,#6a5a4a);filter:saturate(.6)}
.slot.lock{background:linear-gradient(#d9a24a,#a8601a)}
.face{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid var(--line);background:radial-gradient(circle at 40% 35%,#c8f27a,#6aa832);position:relative}
.face:before{content:"";position:absolute;left:5px;top:8px;width:7px;height:7px;background:#fff;border:1.5px solid var(--line);border-radius:50%}
.face:after{content:"";position:absolute;left:15px;top:9px;width:5px;height:5px;background:#fff;border:1.5px solid var(--line);border-radius:50%}
.slot div{text-align:left;line-height:1.1;font-size:16px}.slot small{display:flex;align-items:center;gap:3px;font-size:14px}
.slot small i{width:12px;height:12px;border-radius:50%;background:#ffd23a;border:1.5px solid var(--line)}
#toast{position:fixed;top:26%;left:50%;transform:translateX(-50%);background:var(--pill);border:2px solid #c98a2a;padding:12px 20px;border-radius:16px;text-align:center;display:none;max-width:80%}
#tools{position:fixed;right:10px;top:calc(100px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
.tb{width:50px;height:50px;border-radius:50%;border:3px solid var(--line);font:inherit;font-size:13px;line-height:1.05;color:#fff;background:linear-gradient(#ff8a4a,#d9421b);box-shadow:0 4px 0 #5a2506,inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 var(--line)}
.tb.bl{background:linear-gradient(#6ab8ff,#2a62d8)}.tb.off{background:linear-gradient(#9a8a78,#6a5a4a)}
.slot.go{animation:pg 1s infinite}@keyframes pg{50%{filter:brightness(1.28)}}
#hint{position:fixed;left:50%;top:44%;transform:translateX(-50%);font-size:24px;pointer-events:none;text-align:center;animation:bn 1s infinite}@keyframes bn{50%{transform:translate(-50%,-10px)}}
@media (prefers-reduced-motion:reduce){.slot.go,#hint{animation:none}}
.tb.go{animation:pg 1s infinite}
#shop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:5}
#sp{width:100%;max-width:420px;max-height:90%;overflow:auto;background:linear-gradient(#5a2c10,#2e1507);border:4px solid #c98a2a;border-radius:20px;padding:14px;box-sizing:border-box}
#sh{font-size:26px;text-align:center;margin-bottom:8px;color:var(--gold)}
.wr{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);border:2px solid #7a4a1a;border-radius:14px;padding:8px;margin-bottom:8px}
.wr.eq{border-color:var(--gold);background:rgba(255,210,58,.15)}
.wi{font-size:30px;width:40px;text-align:center}
.wr div{flex:1;line-height:1.15}.wr small{display:block;opacity:.8;font-size:13px}
.wb{border:3px solid var(--line);border-radius:12px;padding:6px 10px;font:inherit;font-size:14px;color:#fff;background:linear-gradient(#8fd14a,#4c9a22);box-shadow:0 3px 0 #1a3a08;min-width:86px;text-shadow:0 1px 0 var(--line)}
.wb.y{background:linear-gradient(#ffb83a,#e8741a);box-shadow:0 3px 0 #5a2506}.wb:disabled{background:#6a5a4a;box-shadow:none;color:#c8b8a0}
body.ti #app>*:not(canvas):not(#home):not(#menu){display:none!important}
.pt{width:42px;height:42px;flex:none;border:2px solid var(--line);border-radius:12px;background:#2a1a10;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.slot.nl .pt{filter:brightness(.3)}.slot b{font-size:17px}
#bot{box-shadow:0 -6px 18px rgba(0,0,0,.55)}
html,body{background:#000;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#app{position:fixed;top:0;bottom:0;left:50%;width:min(100vw,calc(100vh*.5625));width:min(100vw,calc(100dvh*.5625));transform:translateX(-50%);overflow:hidden;background:#140c07}
#home{position:fixed;left:0;right:0;bottom:0;padding:0 18px calc(24px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;align-items:center;gap:12px;z-index:3}
body.ti #home{display:flex}
.mbtn{display:block;width:100%;margin:8px 0;border:3px solid var(--line);border-radius:16px;padding:12px;font:inherit;font-size:20px;color:#fff;background:linear-gradient(#8fd14a,#4c9a22);box-shadow:0 4px 0 #1a3a08,inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 var(--line),0 0 3px var(--line)}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1a3a08}
.mbtn.o{background:linear-gradient(#ffb83a,#e8741a);box-shadow:0 4px 0 #5a2506,inset 0 2px 0 rgba(255,255,255,.4)}
.mbtn.b{background:linear-gradient(#6ab8ff,#2a62d8);box-shadow:0 4px 0 #10286a,inset 0 2px 0 rgba(255,255,255,.4)}
.mbtn.r{background:linear-gradient(#ff8a4a,#d9421b);box-shadow:0 4px 0 #5a1606,inset 0 2px 0 rgba(255,255,255,.4)}
#home .pl{width:76%;margin:0;font-size:32px;padding:10px 0;animation:pp 1.4s infinite}.pl small{display:block;font-size:14px;opacity:.92}
@keyframes pp{50%{transform:scale(1.05)}}
#hrow{display:flex;gap:10px;width:100%;justify-content:center}
.hb{flex:1;max-width:120px;border:3px solid var(--line);border-radius:14px;padding:8px 4px;font:inherit;font-size:14px;color:#fff;background:linear-gradient(#6ab8ff,#2a62d8);box-shadow:0 3px 0 #10286a,inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 var(--line)}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#mp{width:100%;max-width:380px;max-height:92%;overflow:auto;background:linear-gradient(#5a2c10,#2e1507);border:4px solid #c98a2a;border-radius:20px;padding:14px;box-sizing:border-box}
#mh{font-size:30px;text-align:center;color:var(--gold);margin-bottom:6px}
#how p{margin:7px 0;font-size:15px;line-height:1.25}
@media (prefers-reduced-motion:reduce){#home .pl{animation:none}}
</style>
</head>
<body class="ti"><div id="app">
<canvas id="c"></canvas>
<div id="top">
  <div class="pill t"><i class="ic c"></i><span><span id="coins">0</span><small id="cps" style="display:block;font-size:11px;line-height:1;opacity:.85"></small></span></div>
  <div id="ban"><div id="mine" class="t">MINE 1</div><div id="bar"><div id="fill"></div><div id="bt" class="t"></div></div></div>
  <div class="pill t"><i class="ic g"></i><span id="gems">0</span></div>
</div>
<div id="toast" class="t"></div>
<div id="tools"><button class="tb" id="fz" aria-label="Boost"></button><button class="tb bl" id="am" aria-label="Buy amount">x1</button><button class="tb bl" id="sd" aria-label="Sound">🔊</button></div>
<div id="hint" class="t">Tap the glowing spot!</div>
<button class="tb" id="wp" style="position:fixed;left:10px;top:calc(100px + env(safe-area-inset-top,0px))" aria-label="Weapons">Arms</button>
<button class="tb" id="pb" style="position:fixed;left:10px;top:calc(162px + env(safe-area-inset-top,0px))" aria-label="Perks">Perks</button>
<button class="tb" id="qb" style="position:fixed;left:10px;top:calc(224px + env(safe-area-inset-top,0px))" aria-label="Quests">Quests</button>
<div id="shop"><div id="sp"><div id="sh" class="t">Weapons</div><div id="wl"></div><button class="slot" id="sx" style="justify-content:center;width:100%;margin-top:10px">Close</button></div></div>
<div id="bot"></div>
<button class="tb" id="pz" style="position:fixed;left:10px;top:calc(52px + env(safe-area-inset-top,0px));width:38px;height:38px;font-size:15px" aria-label="Pause">II</button>
<div id="home"><button id="play" class="mbtn pl"></button><div id="hrow"><button class="hb" id="hs">Settings</button><button class="hb" id="hh">How to Play</button><button class="hb" id="hd">Sound ON</button></div></div>
<div id="menu"><div id="mp"><div id="mh" class="t"></div><div id="mb"></div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>{n=Math.floor(n);if(n<1000)return''+n;const u=['K','M','B','T','Qa','Qi'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}return n.toFixed(n<10?2:n<100?1:0)+u[i]};
const rnd=Math.random,now=()=>Date.now();

/* ---------- economy ---------- */
let S={coins:0,gems:0,mine:1,k:0,lv:[1,0,0,0,0,0],t:now()};
try{const r=localStorage.getItem('izm3');if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.lv)&&o.lv.length===6)S=o}}catch(e){}
S.fz=S.fz||0;S.fc=S.fc||0;S.wu=S.wu||[1,0,0,0,0,0];S.we=S.we||0;S.pk=S.pk||[0,0,0,0,0];S.souls=S.souls||0;S.run=S.run||0;S.ab=S.ab||[0,0,0,0,0,0];S.mi=S.mi||0;S.ua=S.ua||0;S.bats=S.bats||0;S.day=S.day||0;S.streak=S.streak||0;S.rl=S.rl||[0,0,0,0,0,0,0,0];
const save=()=>{if(window.__ns)return;S.t=now();try{localStorage.setItem('izm3',JSON.stringify(S))}catch(e){}};
const WP=[
 {n:'Pickaxe',i:'⛏️',k:'pk',dm:1,sp:1,c:0,r:1,d:'Reliable starter tool.'},
 {n:'Sledgehammer',i:'🔨',k:'ha',dm:3.2,sp:.56,c:3000,r:2,d:'Slow, heavy smashes.'},
 {n:'Drill',i:'🔩',k:'dr',dm:1.1,sp:2.7,c:60000,r:3,d:'Very fast hits.'},
 {n:'Dynamite',i:'🧨',k:'dyn',dm:10,sp:.5,c:1.5e6,r:5,d:'Thrown sticks explode for big damage.'},
 {n:'Laser',i:'🔫',k:'la',dm:3.6,sp:2.5,c:8e7,r:7,d:'Rapid beams that never miss.'},
 {n:'Plasma Cannon',i:'🔮',k:'pl',dm:10.7,sp:1.5,c:5e9,r:9,d:'Glowing blasts, massive damage.'}];
const cw=()=>WP[S.we]||WP[0];
const PK=[
 {n:'Tap Power',i:'👆',d:'+60% tap damage per level',g:0,c:200,r:3.2,m:99},
 {n:'Critical Strike',i:'🎯',d:'+3% chance of 5x damage',g:0,c:500,r:3.5,m:16},
 {n:'Coin Value',i:'💰',d:'+15% coins per level',g:0,c:1000,r:3.8,m:99},
 {n:'Auto Tap',i:'🤖',d:'+1 free tap every second',g:1,c:5,r:2,m:10},
 {n:'Boost Time',i:'⚡',d:'+5 seconds of Boost',g:1,c:8,r:2.2,m:6}];
const pc=i=>Math.ceil(PK[i].c*Math.pow(PK[i].r,S.pk[i]));
let combo=0,cmT=0,at=0,bat=null,batT=15+rnd()*10,rbC=0,ws={x:180,y:290,t:0};
const tapDmg=()=>Math.max(2,dps()*.4)*(1+.6*S.pk[0])*(1+.15*rel(3))*(1+Math.min(combo,50)*.04);
const cpsv=()=>dps()*(RW(S.mine,S.k)/HP(S.mine,S.k))*gm();
const soulGain=()=>Math.floor(Math.sqrt(S.run/2e4));
const CH=[
 {n:'Rusty',i:'⛑️',t:'Hard worker',p:'+10% damage',ab:'Power Swing',ad:'3x damage for 6s',q:['Back to work!','Dig dig dig!','One more swing.'],r:'Good work, X.'},
 {n:'Pete',i:'🤠',t:'Lucky gambler',p:'+12% crit chance',ab:'Lucky Streak',ad:'Every hit crits for 6s',q:['Feelin lucky!','Double or nothing!','Gold calls to me.'],r:'Lucky you, X!'},
 {n:'Bolt',i:'⚡',t:'Hyper speedster',p:'+20% attack speed',ab:'Caffeine Rush',ad:'2x speed for 7s',q:['Zoom zoom!','Too slow, boss!','Coffee time!'],r:'Faster, X, faster!'},
 {n:'Boomer',i:'💣',t:'Demolition fan',p:'Every 5th hit explodes',ab:'Big Bang',ad:'Blast worth 15s of damage',q:['Boom time!','More dynamite!','Stand back!'],r:'Boom! Nice, X.'},
 {n:'Goldie',i:'💎',t:'Greedy collector',p:'+20% coins',ab:'Gold Rush',ad:'2x coins for 8s',q:['Mine, all mine!','Shiny!','Pay day!'],r:'Is that gold, X?'},
 {n:'Doc',i:'🩺',t:'Team medic',p:'+15% damage for the crew',ab:'Team Cheer',ad:'Crew +60% damage for 8s',q:['Teamwork!','Stay hydrated.','Good job, team.'],r:'Great teamwork, X!'}];
const ACOL=['#4aa8ff','#ffd23a','#ffee55','#ff7a3a','#ffc830','#7affc0'],ADUR=[6,6,7,0,8,8];
let abt=[0,0,0,0,0,0],abc=[15,15,15,15,15,15],bubs=[],bq=[],bn=6;
const act=s=>abt[s]>0,abm=s=>1+.25*S.ab[s],cdOf=s=>45*Math.pow(.93,S.ab[s])*(1-.1*rel(4));
const pm=s=>{let m=1;if(S.lv[5]>0)m*=1.15;if(act(5))m*=1.6;if(s===0){m*=1.1;if(act(0))m*=3}return m};
const itvS=(s,l)=>itv(l)/((s===2?1.2:1)*(s===2&&act(2)?2:1));
const hired=()=>S.lv.map((l,i)=>l>0?i:-1).filter(i=>i>=0);
function say(s,x){bubs=bubs.filter(b=>b.s!==s);bubs.push({s,x,l:2.6})}
function bossCheer(){const h=hired();if(h.length)say(h[(rnd()*h.length)|0],['Boss down!','Easy!','That was a big one!'][(rnd()*3)|0])}
function useAb(s){if(abc[s]>0)return;abc[s]=cdOf(s);const[x,y]=SLOT[s];
  if(s===3){hit(dps()*15*abm(3),CX,CY-20);spark(CX,CY-20,18,'#ff9a3a');shk=1;snd('die')}else abt[s]=ADUR[s]*abm(s);
  spark(x,y-50,16,ACOL[s]);snd('up');S.ua++;q('ab',1);say(s,CH[s].ab+'!');
  const o=hired().filter(i=>i!==s);if(o.length){const k=o[(rnd()*o.length)|0];bq.push({t:.9,s:k,x:CH[k].r.replace('X',CH[s].n)})}}
function abUI(s,x,y){ctx.save();ctx.translate(x,y-114);const a=act(s);
  if(a){ctx.strokeStyle=ACOL[s];ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.stroke();txt(Math.ceil(abt[s])+'s',0,5,13,'#fff')}
  else if(abc[s]<=0){const p=1+Math.sin(now()/150)*.12;ctx.scale(p,p);ctx.fillStyle=ACOL[s];ctx.beginPath();ctx.arc(0,0,13,0,7);out(2.5);txt('!',0,6,18,'#fff')}
  else{ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill();ctx.strokeStyle=ACOL[s];ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,13,-Math.PI/2,-Math.PI/2+6.283*(1-abc[s]/cdOf(s)));ctx.stroke()}
  ctx.restore();txt(CH[s].n,x,y+17,11,'#fff')}
function drawBubs(){bubs.forEach(b=>{const x0=SLOT[b.s][0],x=Math.max(70,Math.min(290,x0)),y=SLOT[b.s][1]-152;ctx.globalAlpha=Math.min(1,b.l*3);ctx.font=F(12);const w=ctx.measureText(b.x).width+14;ctx.fillStyle='#fff';rr(x-w/2,y-14,w,22,9);out(2.5);ctx.beginPath();ctx.moveTo(x-5,y+7);ctx.lineTo(x0<180?x-10:x+10,y+15);ctx.lineTo(x+4,y+7);ctx.fillStyle='#fff';ctx.fill();ctx.fillStyle='#3a1a08';ctx.textAlign='center';ctx.fillText(b.x,x,y+2);ctx.globalAlpha=1})}
const MS=[['Hire your 2nd zombie',()=>S.lv[1]>0,5],['Use a crew ability (tap a zombie)',()=>S.ua>=1,5],['Reach Mine 2',()=>S.mine>=2,8],['Buy the Sledgehammer',()=>S.wu[1],10],['Hire 4 zombies',()=>S.lv.filter(x=>x>0).length>=4,12],['Catch a golden bat',()=>S.bats>=1,12],['Reach Mine 4',()=>S.mine>=4,15],['Upgrade a zombie to Lv 25',()=>Math.max(...S.lv)>=25,15],['Use 15 crew abilities',()=>S.ua>=15,20],['Reach Mine 6',()=>S.mine>=6,25],['Hire all 6 zombies',()=>S.lv.every(x=>x>0),25],['Own the Dynamite',()=>S.wu[3],30],['Reach Mine 9',()=>S.mine>=9,40],['Rebirth for souls',()=>S.souls>0,50]];
function missionRow(){const m=MS[S.mi];if(!m)return '<div class="wr eq"><span class="wi">🏆</span><div><b>All missions complete!</b><small>More coming soon.</small></div></div>';const d=m[1]();return '<div class="wr eq"><span class="wi">🎯</span><div><b>Mission '+(S.mi+1)+' of '+MS.length+': '+m[0]+'</b><small>Reward '+m[2]+' gems</small></div><button class="wb y" data-m="1"'+(d?'':' disabled')+'>Claim</button></div>'}
function crewRows(){return CH.map((c,s)=>{const L=S.ab[s],cost=4*Math.pow(2,L),h=S.lv[s]>0;const b=!h?'<button class="wb" disabled>Hire first</button>':L>=8?'<button class="wb" disabled>MAX</button>':'<button class="wb" data-a="'+s+'"'+(S.gems<cost?' disabled':'')+'>Gems '+cost+'</button>';return '<div class="wr"><span class="wi">'+c.i+'</span><div><b>'+c.n+': '+c.ab+' Lv '+L+'</b><small>'+c.t+'. '+c.p+'. '+c.ad+'</small></div>'+b+'</div>'}).join('')}
function daily(){const t=now();if(t-S.day>20*36e5){S.streak=t-S.day<48*36e5?Math.min(7,S.streak+1):1;S.day=t;const g=2+S.streak*2,c=Math.max(100,Math.floor(cpsv()*300));S.gems+=g;S.coins+=c;const e=$('toast');e.textContent='Daily reward, day '+S.streak+': +'+g+' gems and '+fmt(c)+' coins!';e.style.display='block';setTimeout(()=>{e.style.display='none'},4200);save()}}
const mult=l=>Math.pow(2,[10,25,50,100,200].filter(m=>l>=m).length);
const dmg=l=>l?2*l*mult(l)*cw().dm*(1+.5*S.souls)*(1+.1*rel(2)+.2*rel(5)+.25*rel(7)):0;
const itv=l=>.9/(1+Math.min(l,100)*.01)/cw().sp;
const upC=(s,l)=>12*Math.pow(5,s)*Math.pow(1.16,l);
const unC=s=>30*Math.pow(7,s);
const HP=(m,k)=>30*Math.pow(3.5,m-1)*Math.pow(1.18,k)*(k===9?3:1);
